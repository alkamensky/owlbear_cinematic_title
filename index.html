<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinematic Location Titles</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="panel">
    <div class="eyebrow">CINEMATIC TITLE / GM</div>
    <h1>Вход в локацию</h1>
    <p class="hint">Затемняет сцену, включает контрастный монохромный пост‑эффект и показывает титр всем участникам комнаты.</p>

    <label class="field">
      <span>Заголовок</span>
      <input id="title" maxlength="80" value="" placeholder="НАЗВАНИЕ ЛОКАЦИИ" autocomplete="off" />
    </label>

    <label class="field">
      <span>Подзаголовок <em>необязательно</em></span>
      <input id="subtitle" maxlength="120" placeholder="НЕОБЯЗАТЕЛЬНАЯ ВТОРАЯ СТРОКА" autocomplete="off" />
    </label>

    <label class="field">
      <span>Время на экране</span>
      <select id="duration">
        <option value="3500">3,5 секунды</option>
        <option value="5000" selected>5 секунд</option>
        <option value="7000">7 секунд</option>
        <option value="10000">10 секунд</option>
      </select>
    </label>

    <label class="field">
      <span>Затемнение сцены</span>
      <input id="darkness" type="range" min="0.35" max="0.85" value="0.62" step="0.01" />
      <div class="range-row"><span>мягче</span><output id="darknessValue">62%</output><span>жёстче</span></div>
    </label>

    <div class="actions">
      <button id="show" class="primary" type="button">ПОКАЗАТЬ ВСЕМ</button>
      <button id="hide" class="secondary" type="button">СКРЫТЬ</button>
    </div>

    <div id="status" class="status">Подключение к Owlbear Rodeo…</div>
    <div id="roleNotice" class="role-notice" hidden>Управление титрами доступно только GM.</div>
  </main>

  <script type="module" src="/main.js"></script>
</body>
</html>
